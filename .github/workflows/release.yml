name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Checkout secure module
      uses: actions/checkout@v5
      with:
        repository: cdufresne81/nc-flash-secure
        token: ${{ secrets.SECURE_REPO_PAT }}
        path: _secure_tmp

    - name: Install secure module
      run: |
        mkdir -p src/ecu/_secure
        cp -r _secure_tmp/* src/ecu/_secure/
      shell: bash

    - name: Set up Python (32-bit, for J2534 bridge)
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        architecture: 'x86'

    - name: Set up Python (64-bit, must be last to stay on PATH)
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        architecture: 'x64'

    - name: Install dependencies (64-bit)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r packaging/requirements-build.txt

    - name: Build 32-bit J2534 bridge
      run: |
        py -3.12-32 -m pip install pyinstaller
        py -3.12-32 -m PyInstaller packaging/j2534_bridge_32.spec --noconfirm
      shell: cmd

    - name: Verify bridge build
      run: |
        if (!(Test-Path "dist\j2534_bridge_32\j2534_bridge_32.exe")) {
          Write-Error "j2534_bridge_32.exe not found"
          exit 1
        }
        Write-Output "Bridge verified: dist\j2534_bridge_32\j2534_bridge_32.exe"
      shell: pwsh

    - name: Stamp version from tag
      run: |
        $ref = "${{ github.ref_name }}"
        if ($ref -match '^v') {
          $version = $ref.TrimStart("v")
        } else {
          $version = "0.0.0-dev"
        }
        (Get-Content src/utils/constants.py) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$version`"" | Set-Content src/utils/constants.py
        Write-Output "Stamped version: $version"
      shell: pwsh

    - name: Run tests
      # The process sometimes dies after pytest has reported every test passed
      # (Windows: exit 1, #149). Same check as ci.yml: tests/conftest.py writes
      # pytest's own status to NCFLASH_PYTEST_STATUS_FILE; when that says 0, the
      # run passed. Any other status, or no status file, fails as usual.
      shell: bash
      run: |
        rm -f "$NCFLASH_PYTEST_STATUS_FILE"
        code=0
        python -m pytest || code=$?
        status=$(cat "$NCFLASH_PYTEST_STATUS_FILE" 2>/dev/null || true)
        echo "python exit code: $code, pytest status: ${status:-none}"
        if [ "$code" -ne 0 ] && [ "$status" = "0" ]; then
          echo "::warning title=Exit code $code after a passing run (#149)::pytest reported status 0 (every test passed), then the process exited with $code while shutting down. Treating the run as passed."
          code=0
        fi
        rm -f "$NCFLASH_PYTEST_STATUS_FILE"
        exit "$code"
      env:
        NCFLASH_PYTEST_STATUS_FILE: pytest-exit-status.txt

    - name: Build with PyInstaller
      run: pyinstaller packaging/NCFlash.spec --noconfirm

    - name: Verify build output
      run: |
        if (!(Test-Path "dist\NCFlash\NCFlash.exe")) {
          Write-Error "NCFlash.exe not found"
          exit 1
        }
        Write-Output "Build verified: dist\NCFlash\NCFlash.exe"
      shell: pwsh

    - name: Install Inno Setup
      run: choco install innosetup --yes --no-progress
      shell: pwsh

    - name: Build installer
      run: |
        $ref = "${{ github.ref_name }}"
        if ($ref -match '^v') {
          $env:APP_VERSION = $ref.TrimStart("v")
        } else {
          $env:APP_VERSION = "0.0.0-dev"
        }
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/installer.iss
      shell: pwsh

    - name: Verify installer output
      run: |
        $installer = Get-ChildItem -Path Output -Filter "*.exe" | Select-Object -First 1
        if (!$installer) {
          Write-Error "Installer exe not found in Output/"
          exit 1
        }
        Write-Output "Installer built: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
      shell: pwsh

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: Output/*.exe

  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5

    - name: Checkout secure module
      uses: actions/checkout@v5
      with:
        repository: cdufresne81/nc-flash-secure
        token: ${{ secrets.SECURE_REPO_PAT }}
        path: _secure_tmp

    - name: Install secure module
      run: |
        mkdir -p src/ecu/_secure
        cp -r _secure_tmp/* src/ecu/_secure/

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libegl1 \
          libxkbcommon0 \
          libfontconfig1 \
          libdbus-1-3 \
          libxcb-xinerama0 \
          libxcb-cursor0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r packaging/requirements-build.txt

    - name: Stamp version from tag
      run: |
        REF="${GITHUB_REF_NAME}"
        if [[ "$REF" == v* ]]; then
          VERSION="${REF#v}"
        else
          VERSION="0.0.0-dev"
        fi
        sed -i "s|APP_VERSION = \".*\"|APP_VERSION = \"$VERSION\"|" src/utils/constants.py
        echo "Stamped version: $VERSION"

    - name: Run tests
      # The process sometimes dies after pytest has reported every test passed
      # (Windows: exit 1, #149). Same check as ci.yml: tests/conftest.py writes
      # pytest's own status to NCFLASH_PYTEST_STATUS_FILE; when that says 0, the
      # run passed. Any other status, or no status file, fails as usual.
      shell: bash
      run: |
        rm -f "$NCFLASH_PYTEST_STATUS_FILE"
        code=0
        python -m pytest || code=$?
        status=$(cat "$NCFLASH_PYTEST_STATUS_FILE" 2>/dev/null || true)
        echo "python exit code: $code, pytest status: ${status:-none}"
        if [ "$code" -ne 0 ] && [ "$status" = "0" ]; then
          echo "::warning title=Exit code $code after a passing run (#149)::pytest reported status 0 (every test passed), then the process exited with $code while shutting down. Treating the run as passed."
          code=0
        fi
        rm -f "$NCFLASH_PYTEST_STATUS_FILE"
        exit "$code"
      env:
        NCFLASH_PYTEST_STATUS_FILE: pytest-exit-status.txt
        QT_QPA_PLATFORM: offscreen

    - name: Build with PyInstaller
      run: pyinstaller packaging/NCFlash.spec --noconfirm

    - name: Verify build output
      run: |
        if [ ! -f "dist/NCFlash/NCFlash" ]; then
          echo "ERROR: NCFlash binary not found"
          exit 1
        fi
        echo "Build verified: dist/NCFlash/NCFlash"

    - name: Package as tar.gz
      run: |
        REF="${GITHUB_REF_NAME}"
        if [[ "$REF" == v* ]]; then
          VERSION="${REF#v}"
        else
          VERSION="0.0.0-dev"
        fi
        cd dist
        tar -czf "NCFlash-${VERSION}-linux-x86_64.tar.gz" NCFlash/
        ls -lh "NCFlash-${VERSION}-linux-x86_64.tar.gz"

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-package
        path: dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Stable tags must be on master
      # A final tag (no "-") becomes "latest" and is offered to every user;
      # one pushed on a dev commit would ship every unfinished experiment.
      if: ${{ !contains(github.ref_name, '-') }}
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
          echo "::error::$GITHUB_REF_NAME is a stable tag but its commit is not on master. Tag betas as vX.Y.Z-beta.N."
          exit 1
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets

    - name: List release assets
      run: find release-assets -type f

    - name: Extract changelog for this version
      id: changelog
      run: |
        TAG="${GITHUB_REF_NAME}"
        VERSION="${TAG#v}"
        # Try versioned section first, then fall back to [Unreleased]
        NOTES=$(sed -n "/^## \[v${VERSION}\]/,/^## \[/{/^## \[v${VERSION}\]/d;/^## \[/d;p;}" CHANGELOG.md | sed '/^$/N;/^\n$/d')
        if [ -z "$NOTES" ]; then
          NOTES=$(sed -n "/^## \[Unreleased\]/,/^## \[/{/^## \[Unreleased\]/d;/^## \[/d;p;}" CHANGELOG.md | sed '/^$/N;/^\n$/d')
        fi
        if [ -z "$NOTES" ]; then
          NOTES="Release $TAG"
        fi
        echo "$NOTES" > release_notes.md
        echo "Release notes extracted for $TAG"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-assets/windows-installer/*.exe
          release-assets/linux-package/*.tar.gz
        body_path: release_notes.md
        # A tag like v2.18.0-rc1 must not become "latest": the in-app updater
        # only offers the latest final release.
        prerelease: ${{ contains(github.ref_name, '-') }}
