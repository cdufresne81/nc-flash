[pytest]
# Pytest configuration for NC Flash

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests
pythonpath = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers
    --strict-markers
    # Warnings
    -W error::DeprecationWarning
    -W error::PendingDeprecationWarning
    # Bench tests use real sockets; opt in with '-m bench'.
    -m "not bench"

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    bench: real-socket/real-hardware checks, deselected by default (run with '-m bench')
    graph: graph-engine window tests; off locally unless NCFLASH_GRAPH_TESTS=1 (see tests/conftest.py)

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */venv-windows/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
